[package]
name = "heartline"
version = "0.1.0"
edition = "2021"
description = "Heartline - your music becomes a top-down vaporwave bullet-hell"

[dependencies]
macroquad = { version = "0.4.16", default-features = false }
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
rustfft = "6"
rfd = "0.18"

[profile.release]
opt-level = 3
debug = false
incremental = true
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
